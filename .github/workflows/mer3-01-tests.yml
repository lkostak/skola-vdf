name: MER3-01 lesson tests
on:
  push:
    paths:
      - 'mechatronika/vyuka/3-rocnik/01-proc-automatizujeme-ovladani-a-regulace/**'
      - 'tests/mer3-01-model.test.js'
      - '.github/workflows/mer3-01-tests.yml'
  pull_request:
    paths:
      - 'mechatronika/vyuka/3-rocnik/01-proc-automatizujeme-ovladani-a-regulace/**'
      - 'tests/mer3-01-model.test.js'
      - '.github/workflows/mer3-01-tests.yml'
  workflow_dispatch:

jobs:
  lesson-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: node --check mechatronika/vyuka/3-rocnik/01-proc-automatizujeme-ovladani-a-regulace/app.js
      - name: Check interactive behavior and model
        run: node --test tests/mer3-01-model.test.js
