name: MER3-01 model and 3rd-year thematic plan tests
on:
  push:
    paths:
      - 'mechatronika/vyuka/3-rocnik/**'
      - 'tests/mer3-01-model.test.js'
      - 'tests/mer3-plan.test.js'
      - '.github/workflows/mer3-01-tests.yml'
  pull_request:
    paths:
      - 'mechatronika/vyuka/3-rocnik/**'
      - 'tests/mer3-01-model.test.js'
      - 'tests/mer3-plan.test.js'
      - '.github/workflows/mer3-01-tests.yml'
  workflow_dispatch:
jobs:
  course-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check mechatronika/vyuka/3-rocnik/lessons.js
          node --check mechatronika/vyuka/3-rocnik/catalog.js
          node --check mechatronika/vyuka/3-rocnik/lesson-page.js
          node --check mechatronika/vyuka/3-rocnik/01-proc-automatizujeme-ovladani-a-regulace/app.js
      - name: Check source hour allocation and legacy model
        run: node --test tests/mer3-plan.test.js tests/mer3-01-model.test.js
