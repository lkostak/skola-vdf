name: Maturita 05 · logické modely

on:
  push:
    branches: [main]
    paths:
      - "assets/js/rs-core.js"
      - "assets/js/clock-core.js"
      - "mechatronika/maturita/05a-pamet-rs/index.html"
      - "mechatronika/maturita/05a-pamet-rs/app.js"
      - "mechatronika/maturita/05-sekvencni-logika/index.html"
      - "mechatronika/maturita/05b-synchronni-logika/app.js"
      - "tests/rs-core.test.js"
      - "tests/clock-core.test.js"
      - "tests/lesson-05-content.test.js"
      - ".github/workflows/mer05-js-tests.yml"
  pull_request:
    paths:
      - "assets/js/rs-core.js"
      - "assets/js/clock-core.js"
      - "mechatronika/maturita/05a-pamet-rs/index.html"
      - "mechatronika/maturita/05a-pamet-rs/app.js"
      - "mechatronika/maturita/05-sekvencni-logika/index.html"
      - "mechatronika/maturita/05b-synchronni-logika/app.js"
      - "tests/rs-core.test.js"
      - "tests/clock-core.test.js"
      - "tests/lesson-05-content.test.js"
      - ".github/workflows/mer05-js-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test modelů RS, D, JK a časových diagramů
    runs-on: ubuntu-latest
    steps:
      - name: Načti repozitář
        uses: actions/checkout@v4
      - name: Nastav Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Zkontroluj syntaxi interaktivních skriptů
        run: |
          node --check assets/js/rs-core.js
          node --check assets/js/clock-core.js
          node --check mechatronika/maturita/05a-pamet-rs/app.js
          node --check mechatronika/maturita/05b-synchronni-logika/app.js
      - name: Spusť jednotkové testy RS, D, JK a časových diagramů
        run: node --test tests/rs-core.test.js tests/clock-core.test.js tests/lesson-05-content.test.js
