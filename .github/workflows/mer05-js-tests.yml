name: Maturita 05 · logické modely

on:
  push:
    branches: [main]
    paths:
      - "assets/js/rs-core.js"
      - "tests/rs-core.test.js"
      - ".github/workflows/mer05-js-tests.yml"
  pull_request:
    paths:
      - "assets/js/rs-core.js"
      - "tests/rs-core.test.js"
      - ".github/workflows/mer05-js-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test modelů RS a START/STOP
    runs-on: ubuntu-latest
    steps:
      - name: Načti repozitář
        uses: actions/checkout@v4
      - name: Nastav Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Spusť jednotkové testy
        run: node --test tests/rs-core.test.js
